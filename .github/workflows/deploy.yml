name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mvp-frontend-synthetic-data-0agym4
  workflow_dispatch:

# El sitio se publica desde la rama gh-pages (fuente configurada en el repo),
# así que el workflow solo necesita poder escribir contenido.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerar datos sintéticos, verificar tipos y construir
        run: npm run build

      - name: Publicar en gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar build de Pages desde ${GITHUB_SHA:0:7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Publicado: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
